<!DOCTYPE html>
<html lang="el" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
if(sessionStorage.getItem('internalNav')){document.documentElement.classList.add('skip-loader');sessionStorage.removeItem('internalNav');}
document.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==document.body){if(t.tagName==='A'&&t.href){try{if(window.location.origin===new URL(t.href).origin&&t.target!=='_blank')sessionStorage.setItem('internalNav','1');}catch(err){}return;}t=t.parentNode;}
},true);
    </script>
    <title>ArTzi Rehearsal Studios</title>
    <meta name="description" content="ArTzi Rehearsal Studios - σύγχρονοι, άνετοι χώροι προβών με επαγγελματικό εξοπλισμό για μουσικούς και συγκροτήματα.">
    <link rel="stylesheet" href="assets/css/main.css?v=3.0">
</head>
<body>

    <div id="page-loader" class="page-loader" aria-hidden="true">
        <img src="assets/images/RG_LOGO.JPG" alt="">
    </div>
    <script>
(function(){
  if(document.documentElement.classList.contains('skip-loader'))return;
  function hideLoader(){
    var el=document.getElementById('page-loader');
    if(!el)return;
    el.classList.add('page-loader-fade-out');
    setTimeout(function(){el.remove();},500);
  }
  function run(){setTimeout(hideLoader,500);}
  if(document.readyState==='complete')run();
  else window.addEventListener('load',run);
  setTimeout(hideLoader,8000);
})();
    </script>

    <!-- TOP HEADER BAR -->

                <span class="brand-subtitle">Rehearsal Studios</span>
            </a>
            <nav class="main-nav">

                    <li><a href="contact.html">Επικοινωνείστε μαζί μας</a></li>
                </ul>
            </nav>
            <div class="lang-switch">
                <span>GR</span> | <a href="en/index.html">EN</a>

        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- About Preview with photo background -->
        <section id="about" class="section section-photo-bg section-bg-home" aria-label="Εικόνα χώρου">

                    <h2>Σχετικά με το ArTzi</h2>
                    <p>Ήσυχος, προσεγμένος χώρος αφιερωμένος στις πρόβες — ακουστική, εξοπλισμός και άνεση.</p>
                </div>
            </div>
        </section>

        <!-- Video -->
        <section id="video" class="section">
            <div class="container">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/ScMzIvxBSi4" title="ArTzi Rehearsal Studios video" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        </section>

    </main>

    <!-- BOTTOM FOOTER BAR -->
