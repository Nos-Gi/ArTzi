    <script>
if(sessionStorage.getItem('internalNav')){document.documentElement.classList.add('skip-loader');sessionStorage.removeItem('internalNav');}
document.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==document.body){if(t.tagName==='A'&&t.href){try{if(window.location.origin===new URL(t.href).origin&&t.target!=='_blank')sessionStorage.setItem('internalNav','1');}catch(err){}return;}t=t.parentNode;}
},true);
    </script>

    <script>
(function(){
  if(document.documentElement.classList.contains('skip-loader'))return;
  function hideLoader(){
    var el=document.getElementById('page-loader');
    if(!el)return;
    el.classList.add('page-loader-fade-out');
    setTimeout(function(){el.remove();},500);
  }
  function run(){setTimeout(hideLoader,500);}
  if(document.readyState==='complete')run();
  else window.addEventListener('load',run);
  setTimeout(hideLoader,8000);
})();
    </script>
